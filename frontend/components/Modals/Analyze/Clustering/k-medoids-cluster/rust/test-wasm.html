<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Medoids WASM Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .result {
            background: #f0f0f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { color: green; }
        .error { color: red; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>K-Medoids WASM Module Test</h1>
    
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="testClustering()">Test Clustering</button>
    
    <div id="results"></div>

    <script type="module">
        import init, { test_connection, run_k_medoids } from './pkg/wasm.js';

        // Initialize WASM module
        let wasmInitialized = false;
        
        async function initWasm() {
            if (!wasmInitialized) {
                await init();
                wasmInitialized = true;
                log('✅ WASM Module Initialized', 'success');
            }
        }

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }

        window.testConnection = async function() {
            try {
                await initWasm();
                const result = test_connection();
                log(`Connection Test: ${result}`, 'success');
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        window.testClustering = async function() {
            try {
                await initWasm();
                
                // Test data: 6 points in 2D space
                const testData = {
                    data: [
                        [1.0, 2.0],
                        [1.5, 1.8],
                        [5.0, 8.0],
                        [8.0, 8.0],
                        [1.0, 0.6],
                        [9.0, 11.0]
                    ],
                    n_clusters: 2,
                    method: "PAM",
                    max_iterations: 100,
                    distance_metric: "euclidean",
                    random_seed: null
                };

                log('Running K-Medoids clustering...', 'info');
                const result = run_k_medoids(testData);
                
                log('Clustering Result:', 'success');
                log(JSON.stringify(result, null, 2), 'info');
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // Auto-initialize on load
        initWasm();
    </script>
</body>
</html>
