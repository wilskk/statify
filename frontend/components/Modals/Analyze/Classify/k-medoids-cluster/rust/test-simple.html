<!DOCTYPE html>
<html>
<head>
    <title>Simple PAM Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .log {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #4CAF50;
        }
        .error {
            border-left-color: #f44336;
            color: #f44336;
        }
        .info {
            border-left-color: #2196F3;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h2>PAM K-Medoids Test</h2>
    <button onclick="runTest()">Run Test</button>
    <div id="output"></div>

    <script type="module">
        function log(msg, type = 'log') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            if (typeof msg === 'object') {
                const pre = document.createElement('pre');
                pre.textContent = JSON.stringify(msg, null, 2);
                div.appendChild(pre);
            } else {
                div.textContent = msg;
            }
            document.getElementById('output').appendChild(div);
            console.log(msg);
        }

        let wasmModule = null;

        async function initWasm() {
            try {
                log('Loading WASM module...', 'info');
                const init = await import('./pkg/wasm.js');
                await init.default();
                wasmModule = await import('./pkg/wasm.js');
                log('✓ WASM module loaded successfully!', 'log');
                return true;
            } catch (e) {
                log('✗ Failed to load WASM: ' + e.message, 'error');
                console.error(e);
                return false;
            }
        }

        window.runTest = async function() {
            document.getElementById('output').innerHTML = '';
            
            if (!wasmModule) {
                const success = await initWasm();
                if (!success) return;
            }

            try {
                log('Testing connection...', 'info');
                const connectionResult = wasmModule.test_connection();
                log('Connection: ' + connectionResult, 'log');

                log('Preparing test data...', 'info');
                const testData = {
                    data: [
                        [1.0, 2.0],
                        [1.5, 1.8],
                        [5.0, 8.0],
                        [8.0, 8.0],
                        [1.0, 0.6],
                        [9.0, 11.0]
                    ],
                    n_clusters: 2,
                    method: "PAM",
                    max_iterations: 100,
                    distance_metric: "euclidean",
                    random_seed: null
                };

                log('Input data:', 'info');
                log(testData, 'log');

                log('Running K-Medoids clustering...', 'info');
                const result = wasmModule.run_k_medoids(testData);
                
                log('✓ Clustering completed!', 'log');
                log('Result:', 'info');
                log(result, 'log');

            } catch (e) {
                log('✗ Error: ' + e.message, 'error');
                log('Stack trace:', 'error');
                log(e.stack, 'error');
                console.error(e);
            }
        };

        // Auto-init on load
        initWasm();
    </script>
</body>
</html>
